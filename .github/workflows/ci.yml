name: Validate and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env: {POSTGRES_PASSWORD: ci_password, POSTGRES_DB: workbench}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/workbench
      DATABASE_URL_ADMIN: postgresql://postgres:ci_password@localhost:5432/workbench
      BOOTSTRAP_EMAIL: ci@example.invalid
      BOOTSTRAP_PASSWORD: ci-demo-password-only
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      COOKIE_SECURE: 'false'
      PUBLIC_URL: http://127.0.0.1:4173
      CI_DIAGNOSTICS: 'true'
      MODEL_HOST_ALLOWLIST: localhost:8089
      ALLOW_LOCAL_MODEL_HTTP: 'true'
      STORAGE_PATH: /tmp/workbench-objects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run db:deploy && npm run seed
      - name: API, importer, RLS and external uploader integration
        run: |
          psql "$DATABASE_URL_ADMIN" -c "ALTER ROLE workbench_app LOGIN PASSWORD 'app_ci_password'; ALTER ROLE workbench_worker LOGIN PASSWORD 'worker_ci_password'; GRANT USAGE,CREATE ON SCHEMA public TO workbench_worker; GRANT CREATE ON DATABASE workbench TO workbench_worker;"
          DATABASE_URL=postgresql://workbench_app:app_ci_password@localhost:5432/workbench node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          DATABASE_URL=postgresql://workbench_worker:worker_ci_password@localhost:5432/workbench node apps/api/dist/worker.js > /tmp/worker.log 2>&1 &
          python3 tests/model_stub.py > /tmp/model-stub.log 2>&1 &
          python3 tests/integration.py
      - name: Browser acceptance and screenshots
        run: |
          npx playwright install --with-deps chromium
          npm exec -w @workbench/web -- vite preview --host 127.0.0.1 --port 4173 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          npx playwright test
      - name: Save schema, lockfile and diagnostic logs
        if: always()
        run: |
          mkdir -p artifacts
          cp package-lock.json artifacts/ || true
          node node_modules/prisma/build/index.js migrate diff --from-empty --to-schema-datamodel apps/api/prisma/schema.prisma --script > artifacts/0001_initial.sql || true
          cp /tmp/api.log /tmp/worker.log /tmp/web.log artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: validation-artifacts, path: artifacts/}
  images:
    if: github.event_name != 'pull_request'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/sakuralaaa/hui-business-api:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,scope=api-${{ matrix.arch }},mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/sakuralaaa/hui-business-web:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,scope=web-${{ matrix.arch }},mode=max
      - name: Run built images and restore a database backup
        env:
          POSTGRES_PASSWORD: cloud_container_admin_password
          APP_DB_PASSWORD: cloud_container_app_password
          WORKER_DB_PASSWORD: cloud_container_worker_password
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOOTSTRAP_EMAIL: image-check@example.invalid
          BOOTSTRAP_PASSWORD: image-cloud-password-only
          PUBLIC_URL: http://localhost:8080
          COOKIE_SECURE: 'false'
          API_IMAGE: ghcr.io/sakuralaaa/hui-business-api:${{ github.sha }}-${{ matrix.arch }}
          WEB_IMAGE: ghcr.io/sakuralaaa/hui-business-web:${{ github.sha }}-${{ matrix.arch }}
        run: |
          docker compose up -d db migrate api worker web
          docker compose run --rm seed
          for i in $(seq 1 45); do curl -sf http://localhost:8080/api/health && break; sleep 2; done
          curl -sf http://localhost:8080/ > /tmp/index.html
          curl -sf -X POST -H 'Content-Type: application/json' --data '{"email":"image-check@example.invalid","password":"image-cloud-password-only"}' http://localhost:8080/api/v1/auth/login > /tmp/login.json
          python3 -c "import json; assert len(json.load(open('/tmp/login.json'))['memberships']) == 3"
          docker compose exec -T db pg_dump -U workbench_admin -d workbench -Fc > /tmp/backup.dump
          docker compose exec -T db createdb -U workbench_admin restore_check
          docker compose exec -T db pg_restore -U workbench_admin -d restore_check < /tmp/backup.dump
          docker compose exec -T db psql -U workbench_admin -d restore_check -t -c 'SELECT count(*) FROM "Enterprise"' | tr -d ' ' | grep '^3$'
      - name: Container diagnostic logs
        if: failure()
        run: docker compose logs --no-color || true
  publish-manifests:
    if: github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Publish tested AMD64 and ARM64 image indexes
        run: |
          for component in api web; do
            image="ghcr.io/sakuralaaa/hui-business-${component}"
            docker buildx imagetools create -t "${image}:${GITHUB_SHA}" -t "${image}:latest" "${image}:${GITHUB_SHA}-amd64" "${image}:${GITHUB_SHA}-arm64"
            docker buildx imagetools inspect "${image}:${GITHUB_SHA}"
          done

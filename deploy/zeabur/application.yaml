apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: Hui business compact application
spec:
  description: One application service containing web, API, worker and daily backups.
    Install the official PostgreSQL template B20CX0 first; total two services.
  readme: 'For a new installation only. Use an image commit that passed GitHub Actions.
    Original code: Apache-2.0, https://github.com/Sakuralaaa/hui-business . Existing
    installations must update their saved service ID and preserve /data; do not deploy
    this template again. Disable BOOTSTRAP_ON_START after initialization. Backups
    are on the same server; off-server copies remain required.'
  variables:
  - key: APP_IMAGE_TAG
    type: STRING
    name: APP_IMAGE_TAG
    description: Validated image commit SHA
  - key: HUI_ENCRYPTION_KEY
    type: STRING
    name: HUI_ENCRYPTION_KEY
    description: HUI_ENCRYPTION_KEY
  - key: PUBLIC_ORIGIN
    type: STRING
    name: PUBLIC_ORIGIN
    description: PUBLIC_ORIGIN
  - key: APP_DB_PASSWORD
    type: STRING
    name: APP_DB_PASSWORD
    description: 48 hexadecimal characters
  - key: WORKER_DB_PASSWORD
    type: STRING
    name: WORKER_DB_PASSWORD
    description: 48 hexadecimal characters
  - key: BACKUP_DB_PASSWORD
    type: STRING
    name: BACKUP_DB_PASSWORD
    description: 48 hexadecimal characters
  - key: ADMIN_EMAIL
    type: STRING
    name: ADMIN_EMAIL
    description: ADMIN_EMAIL
  - key: ADMIN_PASSWORD
    type: STRING
    name: ADMIN_PASSWORD
    description: ADMIN_PASSWORD
  services:
  - name: hui-business
    template: PREBUILT_V2
    spec:
      source:
        image: ghcr.io/sakuralaaa/hui-business-api:${APP_IMAGE_TAG}
        runAsUserID: 0
      ports:
      - id: web
        port: 8080
        type: HTTP
      portForwarding:
        enabled: false
      healthCheck:
        type: HTTP
        port: web
        http:
          path: /api/health
      volumes:
      - id: application
        dir: /data
      env:
        DATABASE_URL:
          default: postgresql://workbench_app:${APP_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
        DATABASE_URL_WORKER:
          default: postgresql://workbench_worker:${WORKER_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
        DATABASE_URL_ADMIN:
          default: ${POSTGRES_CONNECTION_STRING}
        BACKUP_DATABASE_URL:
          default: postgresql://workbench_backup:${BACKUP_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
        APP_DB_PASSWORD:
          default: ${APP_DB_PASSWORD}
        WORKER_DB_PASSWORD:
          default: ${WORKER_DB_PASSWORD}
        BACKUP_DB_PASSWORD:
          default: ${BACKUP_DB_PASSWORD}
        ENCRYPTION_KEY:
          default: ${HUI_ENCRYPTION_KEY}
        PUBLIC_URL:
          default: ${PUBLIC_ORIGIN}
        COOKIE_SECURE:
          default: 'true'
        PORT:
          default: '3000'
        BOOTSTRAP_ON_START:
          default: 'true'
        BOOTSTRAP_EMAIL:
          default: ${ADMIN_EMAIL}
        BOOTSTRAP_PASSWORD:
          default: ${ADMIN_PASSWORD}
        STORAGE_PATH:
          default: /data/objects
        BACKUP_PATH:
          default: /data/backups
        CATALOG_PATH:
          default: /app/catalog
        MODEL_HOST_ALLOWLIST:
          default: api.openai.com,api.deepseek.com,dashscope.aliyuncs.com

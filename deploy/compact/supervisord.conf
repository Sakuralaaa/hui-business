[supervisord]
user=root
nodaemon=true
logfile=/dev/null
pidfile=/tmp/hui/supervisord.pid

[program:api]
command=node /app/deploy/compact/run.cjs api
directory=/app
user=node
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=node /app/deploy/compact/run.cjs worker
directory=/app
user=node
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/usr/sbin/nginx -c /app/deploy/compact/nginx.conf -g "daemon off;"
user=node
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backup]
command=node /app/deploy/compact/run.cjs backup
directory=/app
user=node
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
